### TMUX Config ###

## Set the default TERM/SHELL
set -g default-terminal tmux-256color
set -g default-shell /run/current-system/sw/bin/zsh
set -g default-command 'zsh'

## Update the TERM variable of terminal emulator when creating a new session or attaching a existing session
set-option -g update-environment "DISPLAY \
                                  SSH \
                                  SSH_AGENT_PID \
                                  WINDOWID \
                                  XAUTHORITY \
                                  SSH_AUTH_SOCK \
                                  SSH_CONNECTION \
                                  TERM"

# force a reload of the config file
unbind r
bind r source-file ~/.tmux.conf

# user options
set-option -g history-limit 5000
set -g mouse on

bind-key -n Home send Escape "OH"
bind-key -n End send Escape "OF"

bind -n M-H resize-pane -L 2
bind -n M-L resize-pane -R 2
bind -n M-K resize-pane -U 2
bind -n M-J resize-pane -D 2

# plugin list
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'
# set -g @plugin 'Nybkox/tmux-kanagawa'

# theme options
run ~/.tmux/plugins/catppuccin/tmux/catppuccin.tmux

# set -g @kanagawa-show-powerline true
# set -g @kanagawa-plugins "cpu-usage ram-usage"
# set -g @kanagawa-show-flags true
# set -g @kanagawa-show-left-icon window 
# set -g @kanagawa-ram-usage-label ""
# set -g @kanagawa-cpu-usage-label ""

set-hook -g client-dark-theme {
  set -g @catppuccin_flavor "mocha"
  set -g @catppuccin_reset "true"

  run ~/.tmux/plugins/catppuccin/tmux/catppuccin.tmux
}

set-hook -g client-light-theme {
  set -g @catppuccin_flavor "latte"
  set -g @catppuccin_reset "true"
  
  run ~/.tmux/plugins/catppuccin/tmux/catppuccin.tmux
}

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100

set -g status-left ""

set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#[bg=#{@thm_flamingo},fg=#{@thm_surface_0}]#[reverse]#[noreverse]󱀙 "
set -ag status-right "#[fg=#{@thm_fg},bg=#{@thm_surface_0}] #(free -h | awk '/Mem:/ {print $3}') "
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_battery}"

set -g @catppuccin_status_application_text_fg "#{E:@thm_fg}"
set -g @catppuccin_status_battery_text_fg "#{E:@thm_fg}"

run ~/.tmux/plugins/tmux-cpu/cpu.tmux
run ~/.tmux/plugins/tmux-battery/battery.tmux

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'

