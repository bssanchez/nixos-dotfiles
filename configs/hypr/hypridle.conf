# hypridle — auto-bloqueo por inactividad
# All listeners query ~/.cache/idle_enabled

general {
    lock_cmd = ~/.config/hypr/scripts/lockscreen.sh   # respeta idle_enabled + evita duplicados
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

listener {
    timeout = 300
    on-timeout = ~/.config/hypr/scripts/lockscreen.sh
}

listener {
    timeout = 360
    on-timeout = grep -q disabled "$HOME/.cache/idle_enabled" || hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 900
    on-timeout = grep -q disabled "$HOME/.cache/idle_enabled" || systemctl suspend
}
